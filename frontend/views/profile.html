      <div class="sidebar-scrollable">
        
        
      </div>
    </aside>
    
    <div class="dashboard-main-wrapper">
      <header class="page-header">
      <a href="dashboard.html" class="back-link">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        Back

      <h2 class="page-title">My Profile</h2>

      <div class="dashboard-content">
        
        <main class="main-content" style="margin-top: 20px;">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="profile-avatar" style="box-shadow: var(--shadow-card);">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M3 21v-2a7 7 0 0 1 14 0v2" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </div>
        <h3 style="font-size: 20px; color: #fff; margin-bottom: 4px;">Preety12</h3>
        <p style="color: rgba(255,255,255,0.8); font-size: 14px;">Tier 1 Verified</p>
      </div>

      <section class="summary-section">
        
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-input" value="Preety12" disabled style="background: #f0f0f0;">
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" value="preety12@example.com" disabled style="background: #f0f0f0;">
        </div>

        <hr style="border: none; border-top: 1px solid #f0f0f0; margin: 30px 0;">

        <h3 class="summary-title" style="font-size: 16px;">Security</h3>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 12px; border: 1px solid #eee; border-radius: 8px;">

            <div style="font-size: 13px; color: var(--dash-text-muted);">Not enabled</div>
          </div>
          <button style="color: var(--dash-teal); font-weight: 600; font-size: 14px;">Enable</button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 12px; border: 1px solid #eee; border-radius: 8px;">
          <div>
            <div style="font-weight: 500; font-size: 15px;">Change Password</div>
            <div style="font-size: 13px; color: var(--dash-text-muted);">Last updated 2 months ago</div>
          </div>
          <button style="color: var(--dash-teal); font-weight: 600; font-size: 14px;">Update</button>
        </div>

        <button class="btn-primary" style="background-color: #f44336; margin-top: 30px;" onclick="window.location.href='index.html'">Sign Out</button>
