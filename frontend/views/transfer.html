<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <title>Transfer | Tether</title>
  <meta name="theme-color" content="#1fa298" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>

  
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="sidebar-logo">
        <a href="index.html" class="header__logo">
          <svg viewBox="0 0 49 41" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M10.5 0H38.5C39.2 0 39.7 0.36 40.1 0.93L48.2 15.1C48.6 15.8 48.5 16.7 47.9 17.3L25.5 39.5C24.8 40.2 23.6 40.2 22.9 39.5L0.6 17.4C-0.1 16.8 -0.2 15.8 0.3 15.1L9 0.9C9.3 0.3 9.9 0 10.5 0ZM34.8 6.3V10.3H26.9V13C32.5 13.3 36.7 14.5 36.7 16L36.7 19C36.7 20.5 32.5 21.7 26.9 22V28.7H21.6V22C16 21.7 11.9 20.5 11.8 19L11.8 16C11.9 14.5 16 13.3 21.6 13V10.3H13.7V6.3H34.8ZM24.3 19.9C30.2 19.9 35.2 18.9 36.4 17.5C35.4 16.3 31.6 15.4 26.9 15.2V18.1C26 18.1 25.2 18.1 24.3 18.1C23.4 18.1 22.5 18.1 21.6 18.1V15.2C16.9 15.4 13.1 16.3 12.1 17.5C13.3 18.9 18.3 19.9 24.3 19.9Z" fill="white"/>
          </svg>
          tether
        </a>
      </div>
      <div class="sidebar-scrollable">
        
        
      </div>
    </aside>
    
    <div class="dashboard-main-wrapper">
      <header class="page-header">
      <a href="dashboard.html" class="back-link">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </a>
      <h2 class="page-title">Transfer Funds</h2>
    </header>
      <div class="dashboard-content">
        
        <main class="main-content" style="margin-top: 20px;">
      <section class="summary-section">
        <p style="color: var(--dash-text-muted); margin-bottom: 24px; text-align: center;">
          Send tokens securely to another wallet or exchange.
        </p>

        <form onsubmit="event.preventDefault(); alert('Transfer initiated!'); window.location.href='dashboard.html';">
          <div class="form-group">
            <label class="form-label">Recipient Wallet Address</label>
            <input type="text" class="form-input" placeholder="0x..." required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Network</label>
            <select class="form-input" required style="appearance: none;">
              <option value="" disabled selected>Select network...</option>
              <option value="erc20">Ethereum (ERC20)</option>
              <option value="trc20">Tron (TRC20)</option>
              <option value="polygon">Polygon</option>
              <option value="solana">Solana</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Amount (USDt)</label>
            <input type="number" class="form-input" placeholder="0.00" min="1" step="0.01" required>
            <div style="font-size: 12px; color: var(--dash-text-muted); margin-top: 8px; text-align: right;">
              Available: $0.00
            </div>
          </div>

          <button type="submit" class="btn-primary">Send Transfer</button>
        </form>
      </section>
    </main>
      </div>
    </div>
  </div>
</body>
</html>
