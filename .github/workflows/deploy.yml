name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Lint frontend
        working-directory: ./client
        run: npm run lint

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Run backend tests
        run: npm test
        env:
          NODE_ENV: test
          # Tests use an in-memory MongoDB, but the app still validates that a
          # credible JWT secret is present.
          JWT_SECRET: test-secret-that-is-definitely-long-enough-for-ci-use

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Deployment is intentionally left unconfigured rather than sitting here
  # commented out and pretending to work. Whatever is currently in production
  # was not shipped by this pipeline.
  #
  # To wire it up, add a job here that runs on push to main after
  # build-and-test, using your host's deploy action and repository secrets.
